!fdl.Config
__fn_or_cls__:
  module: mlcast.config.base
  name: Experiment
data: !fdl.Config
  __fn_or_cls__:
    module: mlcast.data.source_data_datamodule
    name: SourceDataDataModule
  batch_size: 16
  dataset_factory: !fdl.Partial
    __fn_or_cls__:
      module: __main__
      name: CombinedDatasetFactory
    dataset_factories:
      dwd: !fdl.Partial
        __fn_or_cls__:
          module: mlcast.data.source_data_datasets
          name: SourceDataIndexedDataset
        deterministic: false
        forecast_steps: 12
        index_path: ../data/mlcast-source-datasets/radklim/v0.1.1/stats_2010-01-02-2010-01-02_24x256x256_3x16x16_10000.parquet
        input_steps: 6
        return_mask: true
        standard_names:
        - rainfall_amount
        zarr_path: ../data/mlcast-source-datasets/radklim/v0.1.1/5_minutes.zarr
      ita: !fdl.Partial
        __fn_or_cls__:
          module: mlcast.data.source_data_datasets
          name: SourceDataIndexedDataset
        deterministic: false
        forecast_steps: 12
        index_path: ../data/mlcast-source-datasets/IT-DPC-SRI/v0.1.0/stats_2023-07-01-2023-07-01_24x256x256_3x16x16_10000.parquet
        input_steps: 6
        return_mask: true
        standard_names:
        - rainfall_flux
        zarr_path: ../data/mlcast-source-datasets/IT-DPC-SRI/v0.1.0/italian-radar-dpc-sri.zarr
  eval_sampler: !fdl.Config
    __fn_or_cls__:
      module: mlcast.sampling.samplers
      name: UniformSampler
    keep_fraction: 0.1
  num_workers: 8
  pin_memory: true
  splits:
    dwd:
      time:
        test: 0.15
        train: 0.7
        val: 0.15
    ita:
      time:
        test: 0.15
        train: 0.7
        val: 0.15
  train_sampler: !fdl.Config
    __fn_or_cls__:
      module: mlcast.sampling.samplers
      name: ImportanceSampler
pl_module: !fdl.Config
  __fn_or_cls__:
    module: mlcast.nowcasting_module
    name: NowcastLightningModule
  ensemble_size: 2
  loss_class: crps
  loss_params:
    temporal_lambda: 0.01
  lr_scheduler: !fdl.Partial
    __fn_or_cls__:
      module: torch.optim.lr_scheduler
      name: ReduceLROnPlateau
    factor: 0.5
    mode: min
    patience: 10
  masked_loss: true
  network: !fdl.Config
    __fn_or_cls__:
      module: mlcast.models.convgru
      name: ConvGruModel
    input_channels: 1
    noisy_decoder: false
    num_blocks: 5
  optimizer: !fdl.Partial
    __fn_or_cls__:
      module: torch.optim.adam
      name: Adam
    fused: true
    lr: 0.0001
trainer: !fdl.Config
  __fn_or_cls__:
    module: pytorch_lightning.trainer.trainer
    name: Trainer
  accelerator: auto
  callbacks:
  - !fdl.Config
    __fn_or_cls__:
      module: pytorch_lightning.callbacks.model_checkpoint
      name: ModelCheckpoint
    mode: min
    monitor: val_loss
    save_top_k: 1
  - !fdl.Config
    __fn_or_cls__:
      module: pytorch_lightning.callbacks.model_checkpoint
      name: ModelCheckpoint
    mode: min
    monitor: train_loss_epoch
    save_top_k: 1
  - !fdl.Config
    __fn_or_cls__:
      module: pytorch_lightning.callbacks.early_stopping
      name: EarlyStopping
    mode: min
    monitor: val_loss
    patience: 100
  - !fdl.Config
    __fn_or_cls__:
      module: pytorch_lightning.callbacks.lr_monitor
      name: LearningRateMonitor
    logging_interval: step
  logger: !fdl.Config
    __fn_or_cls__:
      module: pytorch_lightning.loggers.tensorboard
      name: TensorBoardLogger
    name: mlcast
    save_dir: logs
  max_epochs: 100
